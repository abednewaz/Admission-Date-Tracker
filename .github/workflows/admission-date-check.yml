name: Admission Date Auto Checker

on:
  push:
    paths:
      - ".github/scripts/check_admission_dates.py"
      - ".github/workflows/admission-date-check.yml"
  workflow_dispatch:
  schedule:
    # Bangladesh local time: every hour at minute 17.
    - cron: "17 * * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write
  id-token: write

jobs:
  check-admission-dates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ben poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf pymupdf pytesseract

      - name: Check official admission dates and requirements
        run: python .github/scripts/check_admission_dates.py --mode admission

      - name: Broadcast automatically generated date-change notices
        if: success()
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          import requests

          def parse_notices(text):
              match = re.search(r"window\\.ADMISSION_NOTICES\\s*=\\s*(\\[.*?\\])\\s*;?\\s*$", text, re.S)
              return json.loads(match.group(1)) if match else []

          try:
              old_text = subprocess.check_output(["git", "show", "HEAD:notices.js"], text=True)
          except subprocess.CalledProcessError:
              old_text = "window.ADMISSION_NOTICES = [];"

          with open("notices.js", encoding="utf-8") as f:
              new_text = f.read()

          old = parse_notices(old_text)
          new = parse_notices(new_text)
          old_keys = {
              (n.get("university") or "", n.get("title") or "", n.get("date") or "")
              for n in old
          }
          fresh = [
              n for n in new
              if n.get("generatedBy") == "admission-date-check"
              and (n.get("university") or "", n.get("title") or "", n.get("date") or "") not in old_keys
              and n.get("title")
          ]

          if not fresh:
              print("No automatically generated date-change notices to broadcast.")
          else:
              token_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
              token_request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
              if not token_url or not token_request_token:
                  raise SystemExit("GitHub Actions OIDC token endpoint is unavailable")

              response = requests.get(
                  token_url + "&audience=https://admissiontracker.site",
                  headers={
                      "Authorization": "Bearer " + token_request_token,
                      "Accept": "application/json",
                  },
                  timeout=30,
              )
              response.raise_for_status()
              id_token = response.json().get("value")
              if not id_token:
                  raise SystemExit("GitHub Actions OIDC token was not returned")

              for notice in fresh:
                  response = requests.post(
                      "https://www.admissiontracker.site/api/push-broadcast",
                      headers={
                          "Authorization": "Bearer " + id_token,
                          "Content-Type": "application/json",
                      },
                      json=notice,
                      timeout=30,
                  )
                  print("Broadcast:", notice.get("title"), response.status_code)
                  print(response.text)
                  response.raise_for_status()
          PY

      - name: Commit detected admission updates
        run: |
          if git diff --quiet -- data.js; then
            echo "No admission-date or requirement changes detected."
            exit 0
          fi
          git config user.name "Admission Date Tracker Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js notices.js
          git commit -m "Auto-update admission dates, requirements and notices"
          git push
