name: Admission Date & Notice Auto Checker

on:
  workflow_dispatch:
  schedule:
    # Run hourly at minute 34 to reduce contention around the top of the hour.
    - cron: "34 * * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write

jobs:
  check-admission-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ben poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf pymupdf pytesseract

      - name: Check all admission sources
        run: python .github/scripts/check_admission_dates.py

      - name: Notify subscribers about newly detected notices
        if: hashFiles('notices.js') != ''
        env:
          PUSH_BROADCAST_SECRET: ${{ secrets.PUSH_BROADCAST_SECRET }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          import requests

          def parse_notices(text):
              match = re.search(r"window\.ADMISSION_NOTICES\s*=\s*(\[.*?\])\s*;?\s*$", text, re.S)
              if not match:
                  return []
              return json.loads(match.group(1))

          try:
              old_text = subprocess.check_output(["git", "show", "HEAD:notices.js"], text=True)
          except subprocess.CalledProcessError:
              old_text = "window.ADMISSION_NOTICES = [];"

          with open("notices.js", encoding="utf-8") as f:
              new_text = f.read()

          old = parse_notices(old_text)
          new = parse_notices(new_text)

          old_keys = {(n.get("url") or "", n.get("title") or "") for n in old}
          fresh = [n for n in new if (n.get("url") or "", n.get("title") or "") not in old_keys and n.get("title")]

          if not fresh:
              print("No newly detected notices.")
              sys.exit(0)

          secret = os.environ.get("PUSH_BROADCAST_SECRET")
          if not secret:
              raise SystemExit("PUSH_BROADCAST_SECRET GitHub secret is missing.")

          for notice in fresh:
              r = requests.post(
                  "https://admissiontracker.site/api/push-broadcast",
                  headers={"Authorization": "Bearer " + secret},
                  json=notice,
                  timeout=30,
              )
              print("Broadcast:", notice.get("title"), r.status_code)
              if r.status_code >= 300:
                  print(r.text)
                  r.raise_for_status()
          PY

      - name: Commit detected updates
        run: |
          if git diff --quiet -- data.js notices.js; then
            echo "No admission-date or notice changes detected."
            exit 0
          fi
          git config user.name "Admission Date Tracker Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js notices.js
          git commit -m "Auto-update admission dates and notice board"
          git push
