name: Admission Date Auto Checker

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Run hourly at minute 17 to reduce contention around the top of the hour.
    - cron: "17 * * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write

jobs:
  check-admission-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ben poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf pymupdf pytesseract

      - name: Check all admission sources
        run: python .github/scripts/check_admission_dates.py

      - name: Commit detected updates
        run: |
          if git diff --quiet -- data.js; then
            echo "No admission-date changes detected."
            exit 0
          fi
          git config user.name "Admission Date Tracker Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Auto-update admission dates"
          git push
