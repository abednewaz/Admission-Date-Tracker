name: Check official admission dates

on:
  schedule:
    # 3 checks/day in Bangladesh time (UTC+6): 12:00 AM, 8:00 AM, 4:00 PM.
    - cron: "0 18,2,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-date-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Check official university sources
        run: python scripts/admission_checker.py

      - name: Commit verified changes
        run: |
          if git diff --quiet -- data.js; then
            echo "No verified admission-date changes."
            exit 0
          fi
          git config user.name "admission-date-checker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore: update verified admission dates"
          git push
