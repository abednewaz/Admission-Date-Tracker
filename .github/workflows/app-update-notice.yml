name: One-Time App Update Notice

on:
  push:
    paths:
      - ".github/workflows/app-update-notice.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  notify-app-users:
    runs-on: ubuntu-latest
    steps:
      - name: Send app-only update notice
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          token_request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          if not token_url or not token_request_token:
              raise SystemExit("GitHub Actions OIDC token endpoint is unavailable")

          response = requests.get(
              token_url + ("&" if "?" in token_url else "?") + "audience=https://admissiontracker.site",
              headers={
                  "Authorization": "Bearer " + token_request_token,
                  "Accept": "application/json",
              },
              timeout=30,
          )
          response.raise_for_status()
          id_token = response.json().get("value")
          if not id_token:
              raise SystemExit("GitHub Actions OIDC token was not returned")

          notice = {
              "appOnly": True,
              "title": "📢 Important Admission Tracker App Update",
              "body": "Both the website and app was updated. Please uninstall and re-install the app to get the benefits of the features. We are very sorry for the inconvenience. And thanks for your co-operation.\n\nRegards,\nAbed Newaz\nFounder of Admission Tracker",
              "url": "./",
              "tag": "app-update-20261128"
          }

          response = requests.post(
              "https://www.admissiontracker.site/api/push-broadcast",
              headers={
                  "Authorization": "Bearer " + id_token,
                  "Content-Type": "application/json",
              },
              json=notice,
              timeout=60,
          )
          print("App update broadcast:", response.status_code)
          print(response.text)
          response.raise_for_status()
          PY

      - name: Remove one-time workflow
        run: |
          git config user.name "Admission Tracker Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/app-update-notice.yml
          git commit -m "Remove one-time app update notice workflow"
          git push origin main
