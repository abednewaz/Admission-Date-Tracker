name: Daily Admission Reminders

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/daily-admission-reminders.yml
  schedule:
    # Bangladesh local time: every day at 9:00 AM.
    - cron: "0 9 * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: read
  id-token: write

jobs:
  daily-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send personalized daily reminders
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import requests

          with open("data.js", encoding="utf-8") as f:
              text = f.read()

          match = re.search(r"window\.ADMISSION_EXAMS\s*=\s*(\[.*?\])\s*;?\s*$", text, re.S)
          if not match:
              raise SystemExit("Could not parse data.js")

          exams = json.loads(match.group(1))

          token_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          token_request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          if not token_url or not token_request_token:
              raise SystemExit("GitHub Actions OIDC token endpoint is unavailable")

          response = requests.get(
              token_url + "&audience=https://admissiontracker.site",
              headers={
                  "Authorization": "Bearer " + token_request_token,
                  "Accept": "application/json",
              },
              timeout=30,
          )
          response.raise_for_status()
          id_token = response.json().get("value")
          if not id_token:
              raise SystemExit("GitHub Actions OIDC token was not returned")

          push_response = requests.post(
              "https://www.admissiontracker.site/api/push-daily",
              headers={
                  "Authorization": "Bearer " + id_token,
                  "Content-Type": "application/json",
              },
              json={"exams": exams},
              timeout=60,
          )
          print("Daily reminder response:", push_response.status_code)
          print(push_response.text)
          push_response.raise_for_status()
          PY
