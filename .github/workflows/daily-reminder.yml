name: Daily Admission Reminder

on:
  workflow_dispatch:
  schedule:
    # Bangladesh local time: every day at 09:00.
    - cron: "0 9 * * *"
      timezone: "Asia/Dhaka"

jobs:
  send-daily-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send personalized daily reminder
        env:
          PUSH_BROADCAST_SECRET: ${{ secrets.PUSH_BROADCAST_SECRET }}
        run: |
          if [ -z "$PUSH_BROADCAST_SECRET" ]; then
            echo "PUSH_BROADCAST_SECRET is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error             -X POST "https://admissiontracker.site/api/push-daily-reminder"             -H "Authorization: Bearer $PUSH_BROADCAST_SECRET"             -H "Content-Type: application/json"             -d '{}'
