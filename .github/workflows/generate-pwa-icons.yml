name: Generate PWA PNG icons

on:
  push:
    branches: [main]
    paths-ignore:
      - 'icon-192.png'
      - 'icon-512.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG/WebP converter
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Generate PNG icons
        shell: bash
        run: |
          python - <<'PY'
          import base64, re
          svg = open('icon.svg', 'r', encoding='utf-8').read()
          match = re.search(r'data:image/webp;base64,([^"]+)', svg)
          if not match:
              raise SystemExit('Embedded WebP icon payload not found in icon.svg')
          with open('/tmp/admission-tracker-icon.webp', 'wb') as f:
              f.write(base64.b64decode(match.group(1)))
          PY
          convert -background none /tmp/admission-tracker-icon.webp -resize 192x192 -strip icon-192.png
          convert -background none /tmp/admission-tracker-icon.webp -resize 512x512 -strip icon-512.png
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate PNG PWA icons"
          git push
