name: Repository Integrity Check

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate data, notices, system status and executable JavaScript
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          global.window = {};
          for (const file of ['data.js', 'medical-data.js', 'notices.js', 'system-status.js']) {
            const source = fs.readFileSync(file, 'utf8');
            try { vm.runInThisContext(source, {filename:file}); }
            catch (error) { throw new Error(file + ': ' + error.message); }
          }

          const data = window.ADMISSION_EXAMS || [];
          const notices = window.ADMISSION_NOTICES || [];
          const status = window.ADMISSION_SYSTEM_STATUS || {};
          if (!data.length) throw new Error('No admission records found');

          const ids = data.map(x => x.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate admission record IDs detected');

          for (const row of data) {
            if (!row.universityName || !row.unit || !row.admissionType) {
              throw new Error('Malformed admission record: ' + row.id);
            }
            if (row.examDate && !['Not published yet', 'Better check Yourself'].includes(row.examDate)) {
              if (Number.isNaN(Date.parse(row.examDate + 'T00:00:00Z'))) {
                throw new Error('Invalid exam date: ' + row.id);
              }
            }
          }

          if (!notices.some(n => n.university === 'BUET' && /admission.*circular|circular.*admission/i.test(String(n.title || '')))) {
            throw new Error('BUET circular notice is missing');
          }

          const court = status.courtAdmissionSuspension || {};
          if (!court.active || court.through !== '2026-12-31') {
            throw new Error('Court suspension status is missing or inconsistent');
          }

          const aust = data.find(x => x.id === 'e36');
          if (!aust || aust.examDate !== null) throw new Error('AUST has an invented exam date');

          const buet = data.find(x => x.id === 'e22');
          if (!buet || buet.examDate !== '2027-02-01') throw new Error('BUET date is not 1 February 2027');

          const sw = fs.readFileSync('sw.js', 'utf8');
          if (!sw.includes('notices.js') || !sw.includes('system-status.js')) {
            throw new Error('Service worker is still caching live data');
          }

          for (const file of ['api/push-test.js', 'api/push-daily-reminder.js']) {
            if (fs.existsSync(file)) throw new Error('Legacy endpoint still exists: ' + file);
          }

          console.log('Integrity OK: ' + data.length + ' admission records, ' + notices.length + ' notices');
          NODE


      - name: Validate monitoring script syntax
        run: |
          python -m py_compile .github/scripts/check_admission_dates.py

      - name: Validate Vercel serverless function syntax
        run: |
          node --check api/push-broadcast.js
          node --check api/push-daily.js
          node --check api/push-subscribe.js
          node --check api/reviews.js

      - name: Validate JavaScript syntax
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const files = [
            'data.js',
            'medical-data.js',
            'notices.js',
            'system-status.js',
            'sw.js'
          ];
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            if (file === 'medical-data.js' || file === 'sw.js') {
              // These are browser/service-worker scripts; syntax-only validation is enough.
            }
            try { new Function(source); }
            catch (error) { throw new Error(file + ': ' + error.message); }
          }

          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [];
          let cursor = 0;
          while (true) {
            const open = html.indexOf('<script', cursor);
            if (open < 0) break;
            const openEnd = html.indexOf('>', open);
            const close = html.indexOf('</script>', openEnd);
            if (openEnd < 0 || close < 0) throw new Error('Malformed script tag in index.html');
            const source = html.slice(openEnd + 1, close).trim();
            if (source && !source.startsWith('{')) scripts.push(source);
            cursor = close + 9;
          }
          scripts.forEach((source, i) => {
            try { new Function(source); }
            catch (error) { throw new Error('index.html inline script #' + (i + 1) + ': ' + error.message); }
          });

          if (!html.includes('G-250GLKNKZ0')) throw new Error('GA4 Measurement ID missing');
          if (!html.includes('id="languageToggle"')) throw new Error('Language toggle missing');
          if (!html.includes('adt_language_v3')) throw new Error('Language system missing');
          if (!html.includes('system-status.js')) throw new Error('System status script missing');
          console.log('JavaScript integrity OK');
          NODE
